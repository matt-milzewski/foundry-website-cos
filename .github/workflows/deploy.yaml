name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # Keyless sign-in with the role from infra/github-oidc.yaml, which can only
      # write to this bucket and refresh this CloudFront distribution.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::622842579488:role/natural20tavern-deploy
          aws-region: ap-southeast-2
      # --delete also removes the old .git/ and .github/ copies the previous workflow uploaded
      - name: Upload site
        run: aws s3 sync _site/ s3://thenatural20tavern.com --delete
      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E32CDK4TJQ6G1I --paths "/*"
